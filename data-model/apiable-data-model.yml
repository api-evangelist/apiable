glossary:
  Product: A high-level abstraction of an API product; groups plans together.
  Plan: A subscription plan attached to a product; can carry multiple APIs, free or paid.
  Subscription: A subscription to a plan, owned by a team with one user as primary owner and billing responsible.
  Team: A group of users that work together; may belong to a company.
  Company: A group of teams. Companies carry no roles or permissions and do not share subscriptions between
    their teams.
  User: A platform user; may belong to several teams with different roles in each.
  Invitation: An invitation to join a team; can be sent to an unregistered address.
  WebhookConf: 'An outbound webhook registration: url, subscribed events, signing secret, headers.'
