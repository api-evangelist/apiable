standards:
  - id: openapi-3.1
    conforms: true
    evidence: >-
      openapi/apiable-platform-api-openapi.json declares openapi 3.1.0 with 42 paths, 66
      operations, 62 component schemas, unique operationIds on every operation and a summary on
      every operation.
  - id: oauth2
    conforms: true
    evidence: >-
      components.securitySchemes.oauth-cc is type oauth2 with a clientCredentials flow and a
      tokenUrl; every one of the 66 operations carries an explicit security requirement.
  - id: oauth2-client-credentials
    conforms: true
    evidence: RFC 6749 §4.4 flow, tokenUrl https://developer.apiable.io/api/oauth2/token
  - id: oidc
    conforms: partial
    evidence: >-
      Apiable does not operate an identity provider. Customer portals federate to a customer's own
      OpenID Connect provider (Entra ID, Google, Okta, Cognito, Auth0, Keycloak). Source
      https://www.apiable.io/security/ and /docs/integrations/identity-providers/oidc/. The
      Platform API itself exposes no openIdConnect scheme and no OIDC discovery document.
  - id: standard-webhooks
    conforms: true
    evidence: >-
      Apiable signs every webhook delivery with the Standard Webhooks scheme — webhook-id,
      webhook-timestamp and webhook-signature headers, HMAC-SHA256 over
      {webhook-id}.{webhook-timestamp}.{raw-body}, v1,<base64> signature list, 5-minute replay
      tolerance. Documented at https://www.apiable.io/docs/automation/webhooks/ and mirrored in
      the org's public standard-webhooks repository (https://github.com/apiable/standard-webhooks).
  - id: rfc9457-problem-details
    conforms: false
    evidence: >-
      No response in the spec uses application/problem+json; all 182 response content declarations
      are application/json and no error schema component exists.
  - id: json-api
    conforms: false
  - id: odata
    conforms: false
  - id: scim
    conforms: false
    evidence: >-
      User, Team and Company resources exist but on bespoke paths (/api/users, /api/teams,
      /api/companies) with no urn:ietf:params:scim:schemas:* URN and no /Users or /Groups endpoint.
  - id: fhir
    conforms: false
    evidence: >-
      Apiable markets a healthcare vertical (/healthcare/) for scope management and Dynamic Client
