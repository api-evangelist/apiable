reversibility:
  grade: documented
  applies: true
  note: Apiable publishes real reversal paths for its write surface, and one of them takes an explicit
    effective-at timestamp — but the docs state no WINDOW inside which a reversal is still possible for
    any of them, so this grades `documented`, not `verified`. No window is asserted here that Apiable
    does not publish.
  operations:
  - action: create a subscription
    forward: createSubscription
    reversal: cancelAndRevokeSubscription
    window: null
    detail: DELETE /api/subscriptions/{id} takes a `cancelAt` body field, a Unix-seconds UTC timestamp
      for when the cancellation takes effect. It cancels in the billing system and revokes API access.
      The caller chooses when it lands; Apiable publishes no deadline after which the subscription can
      no longer be cancelled, and no un-cancel operation.
    docs: https://www.apiable.io/docs/api-reference/
  - action: approve a pending subscription
    forward: approveSubscription
    reversal: rejectSubscription
    window: null
    detail: approve and reject are the two terminal moves on a pending subscription request
  - action: approve a pending user
    forward: approveUser
    reversal: rejectUser
    window: null
  - action: register a webhook
    forward: registerWebhook
    reversal: unregisterWebhook
    window: null
    detail: DELETE /api/webhooks/{id}. Deliveries already dispatched are not recalled; a webhook's last
      24 hours of delivery attempts stay readable via getWebhookHistory.
  - action: assign a user to a team
    forward: assignUserToTeam
    reversal: removeUserFromTeam
    window: null
  - action: attach documentation to a plan or API
    forward: createDocByPlanIntegrationId_1 / createDocByApiIntegrationId_1
    reversal: deletePlanDocumentationByPlanId / deleteApiLevelDocumentation
    window: null
  irreversible:
  - operationId: meterSubscriptionUsage
    note: POST /api/subscriptions/usage records billable usage. No reversal, void or correction operation
      is published; the docs describe an `action` of increment or set, so a wrong increment can only be
