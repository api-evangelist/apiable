- aid: apiable:apiable-webhooks-api
  name: Apiable Webhooks API
  description: "# How Webhooks Work\n\nWebhooks are a way for services to communicate with each other\
    \ in real time. When an event occurs, the Webhook sends an HTTP POST request to the URL that you've\
    \ configured. The Webhook itself is unaware of any specific authorization mechanisms like the Apiable\
    \ Lambda authorizer, and the Webhook URL can be any endpoint capable of receiving HTTP POST requests.\n\
    \nOptionally, you can include custom headers in the request. These headers will be appended automatically\
    \ by the Webhook to the HTTP POST request, adding any additional information required for the endpoint.\n\
    \n ## Testing a Webhook before posting\n\nYou can test a Webhook by sending a POST request to the\
    \ Webhook URL manually. Here’s an example curl command that simulates the Webhook sending a POST request:\n\
    \n```bash\ncurl -X POST https:/apiable.example.io/webhook \\\n -H \"Content-Type: application/json\"\
    \ \\\n -H \"api-key: MY-API-KEY\" \\\n -H \"Custom-Header-1: value1\" \\\n -H \"Custom-Header-2: value2\"\
    \ \\\n -d '{\n   \"id\": \"67040bcb1eb964694d999a68\",\n   \"events\": [\n     \"SUBSCRIPTION_CREATED\"\
    \n   ],\n   \"whsec\": \"whsec_CoX***pc=\"\n }'\n```\n\n## Example Webhook Configuration\n\nIn the\
    \ following example, a Webhook is configured to send an HTTP POST request to a URL upon the occurrence\
    \ of a `SUBSCRIPTION_CREATED` event. The parameters \"whsec\" and \"headers\" are optional.\n\n```json\n\
    {\n  \"id\": \"67040bcb1eb964694d999a68\",\n  \"events\": [\n    \"SUBSCRIPTION_CREATED\"\n  ],\n\
    \  \"url\": \"https:/apiable.example.io/webhook\",\n  \"headers\": {\n    \"api-key\": \"MY-API-KEY\"\
    ,\n    \"Custom-Header-1\": \"value1\",\n    \"Custom-Header-2\": \"value2\"\n  }\n}\n```"
  humanURL: https://www.apiable.io/docs/api-reference/
  baseURL: https://developer.apiable.io
  tags:
  - Webhooks
  properties:
  - type: OpenAPI
    url: openapi/apiable-webhooks-api-openapi.yml
  - type: APIReference
    url: https://www.apiable.io/docs/api-reference/
  - type: Documentation
    url: https://www.apiable.io/docs/automation/
