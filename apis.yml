  - aid: apiable:api-portal-platform
    name: Apiable API Portal Platform
    description: >-
      Apiable provides a self-service API portal platform for API product
      managers and developers. It offers single-tenant dedicated portals with
      custom domains, automated API documentation with try-out functionality,
      developer onboarding, subscription management, usage dashboards, and
      role-based access control integrated with existing API gateways.
    humanURL: https://www.apiable.io/platform/api-portal/
    x-note: >-
      Product listing, not a callable endpoint. Apiable's portal platform is delivered as a
      single-tenant portal on each customer's own host, so this entry has no single public base URL
      and none is invented for it. Apiable's one callable, publicly specified API surface is
      catalogued as apiable:platform-api above (baseURL https://developer.apiable.io).
    tags:
