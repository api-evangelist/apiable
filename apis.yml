apis:
  - aid: apiable:platform-api
    name: Apiable Platform API
    description: >-
      The Apiable Platform API (v2) is the REST API Apiable publishes for managing an API program
      programmatically: products, plans, subscriptions, teams, users, companies, invitations,
      documentation entries, file uploads and outbound webhooks. It is an OpenAPI 3.1 contract of
      66 operations across 12 resource groups, authenticated with OAuth 2.0 client credentials and
      scoped with apiable/platform and apiable/cicd. Each customer calls it on their own portal
      host; the published contract names Apiable's own reference portal in servers[].
    humanURL: https://www.apiable.io/docs/api-reference/
    baseURL: https://developer.apiable.io
    tags:
