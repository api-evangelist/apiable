openapi: 3.2.0
info:
  title: Apiable Platform Users API
  description: '## Introduction


    The Apiable Platform API is a RESTful API that allows you to manage your portal, teams, users, and subscriptions.'
  contact:
    name: Apiable Team
    url: https://apiable.io
    email: support@apiable.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: v2
servers:
- url: https://developer.apiable.io
tags:
- name: Users
  description: Users are the people who use the platform. Users can be invited to join the platform by an admin or they can sign up themselves. Users can be assigned to teams and have roles and permissions within those teams. Each user has the possibility to be part of one or more teams, each with their separate roles, permissions and subscriptions.
paths:
  /api/users/{id}/roles:
    put:
      tags:
      - Users
      summary: Update User Roles
      description: Update the roles of a user. The roles are used to define the permissions of the user within the platform. The roles are defined by the platform admin and can be assigned to users by the platform admin or team admins.
      operationId: updateUserRoles
      parameters:
      - name: id
        in: path
        description: The id of the user to be updated the team roles.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: 6409edb91c6c14300fce1a3c
      - name: X-API-Version
        in: header
        description: API version to use.
        required: false
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - '2024-09-25'
      requestBody:
        description: List of roles that need to be assigned to the user.
        content:
          application/json:
            schema:
              description: The role and permissions that a user has in a team
              properties:
                teamId:
                  type: string
                accessDetails:
                  description: Access details and role that the invited user will have
                  properties:
                    roleName:
                      type: string
                      enum:
                      - ADMIN
                      - READ_ONLY
                      - RESTRICTED
                    apiKeys:
                      type: string
                      enum:
                      - NONE
                      - READ
                      - FULL
                    billing:
                      type: string
                      enum:
                      - NONE
                      - READ
                      - FULL
                    teams:
                      type: string
                      enum:
                      - NONE
                      - READ
                      - FULL
            examples:
              Example roles:
                description: User roles.
                value: "\n[\n  {\n    \"teamId\": \"66fbb93c4220cc7d307a5b0a\",\n    \"accessDetails\": {\n      \"roleName\": \"CUSTOM\"\n      \"apiKeys\": \"FULL\",\n      \"billing\": \"READ\",\n      \"teams\": \"NONE\"\n    }\n  }\n]\n"
        required: true
      responses:
        '200':
          description: The user object with the updated fields. The change of the roles will be reflected by the field 'roles' in user.metadata object.
          content:
            application/json:
              schema:
                description: User object
                properties:
                  version:
                    type: integer
                    format: int32
                  created:
                    type: string
                    format: date-time
                  updated:
                    type: string
                    format: date-time
                  id:
                    type: string
                  providerId:
                    type: string
                    description: The provider id of the user
                  metadata:
                    description: The metadata of the user
                    properties:
                      activeTeam:
                        description: Unique identifier to an object
                        properties:
                          id:
                            type: string
                      agreesToReceiveEmail:
                        type: boolean
                        description: Flag to indicate if the user has given consent to receive emails
                      postRegistrationWizardComplete:
                        type: boolean
                        description: Flag to indicate if the user has completed the registration wizard
                      approval:
                        type: string
                        description: Flag to indicate if the user has been approved, if approval process is in place
                        enum:
                        - PENDING
                        - ACTIVE
                        - REJECTED
                      teams:
                        type: array
                        description: List of teams that the user is part of
                        items:
                          description: Unique identifier to an object
                          properties:
                            id:
                              type: string
                      stripeCustomerId:
                        type: string
                        description: The monetization integration ID of the user
                      registrationEmailSent:
                        type: boolean
                        description: Flag to indicate if the user has been sent a registration email
                      teamRoles:
                        type: array
                        description: List of roles that the user has in the teams that they are part of.
                        items:
                          description: The role and permissions that a user has in a team
                          properties:
                            teamId:
                              type: string
                            accessDetails:
                              description: Access details and role that the invited user will have
                              properties:
                                roleName:
                                  type: string
                                  enum:
                                  - ADMIN
                                  - READ_ONLY
                                  - RESTRICTED
                                apiKeys:
                                  type: string
                                  enum:
                                  - NONE
                                  - READ
                                  - FULL
                                billing:
                                  type: string
                                  enum:
                                  - NONE
                                  - READ
                                  - FULL
                                teams:
                                  type: string
                                  enum:
                                  - NONE
                                  - READ
                                  - FULL
                      registrationCustomProperties:
                        type: object
                        additionalProperties:
                          type: string
                          description: Registration custom properties
                        description: Registration custom properties
                      developer:
                        type: boolean
                  givenName:
                    type: string
                    description: The first or given name of the user
                  familyName:
                    type: string
                    description: The last or family name of the user
                  email:
                    type: string
                    description: The email of the user
                  name:
                    type: string
                    description: The full name of the user, read only, constructed from the given and family name
                  active:
                    type: boolean
                    description: Flag to indicate if the user is active
                  company:
                    type: string
                    description: Name of the company the user is part of, by default it is the domain of the email
              examples:
                Example user:
                  description: User object with updated roles.
                  value:
                    id: 6409edb91c6c14300fce1a3c
                    created: '2023-03-09T16:31:21.829'
                    updated: '2023-09-25T14:45:54.602'
                    providerId: VVNFUjpkMTllMjE3ZS02NDI0LTExZWQtOTMwOS0wNjZmNDNjODhjYjI=
                    metadata:
                      activeTeam:
                        id: 6409edb91c6c14300fce1a3a
                      isDeveloper: false
                      agreesToReceiveEmail: false
                      postRegistrationWizardComplete: true
                      approval: ACTIVE
                      registrationEmailSent: true
                      teamRoles:
                      - teamId: 6409edb91c6c14300fce1a3a
                        accessDetails:
                          roleName: ADMIN
                          apiKeys: FULL
                          billing: FULL
                          teams: FULL
                    givenName: Alice
                    familyName: Piable
                    email: alice.piable@apiable.io
                    name: Alice Piable
                    active: true
                    company: Apiable
                    version: 32
        '400':
          description: 'Bad Request: Invalid roles or operation.'
          content:
            application/json:
              schema:
                type: string
              examples:
                BadRequest:
                  description: Error message when the roles update is not allowed for the user.
                  value: Invalid roles update
        '401':
          description: 'Unauthorized for operation: updateUserRoles'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unauthorized
                  status:
                    type: string
                    example: '401'
        '404':
          description: 'Not Found: The user to update roles does not exist.'
          content:
            application/json:
              schema:
                type: string
              examples:
                NotFound:
                  description: Error message when the user to be updated is not found.
                  value: User not found
      security:
      - oauth-cc:
        - apiable/platform
