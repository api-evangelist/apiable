                  description: User object with all its details.
                  value: "\n{\n  \"id\": \"6268ec80a098ed05f047f278\",\n  \"created\": \"2022-04-27T07:10:56.86\",\n  \"updated\": \"2024-10-01T11:24:31.365\",\n  \"providerId\": \"13843842-1001-707c-f74b-505ade4cf865\",\n  \"metadata\": {\n    \"activeTeam\": {\n      \"id\": \"6268ec80a098ed05f047f279\"\n    },\n    \"isDeveloper\": true,\n    \"agreesToReceiveEmail\": true,\n    \"postRegistrationWizardComplete\": true,\n    \"approval\": \"ACTIVE\",\n    \"registrationEmailSent\": false,\n    \"teamRoles\": [\n      {\n        \"teamId\": \"6268ec80a098ed05f047f279\",\n        \"accessDetails\": {\n          \"roleName\": \"ADMIN\",\n          \"apiKeys\": \"FULL\",\n          \"billing\": \"FULL\",\n          \"teams\": \"FULL\"\n        }\n      },\n      {\n        \"teamId\": \"6304fac7b097dd1afb5273f3\",\n        \"accessDetails\": {\n          \"roleName\": \"ADMIN\",\n          \"apiKeys\": \"FULL\",\n          \"billing\": \"FULL\",\n          \"teams\": \"FULL\"\n        }\n      },\n    ]\n  },\n  \"givenName\": \"Alexander 2\",\n  \"familyName\": \"Schamne\",\n  \"email\": \"albert.piable@apiable.io\",\n  \"name\": \"Albert Piable\",\n  \"active\": true,\n  \"company\": \"Apiable\",\n  \"version\": 42\n}\n"
