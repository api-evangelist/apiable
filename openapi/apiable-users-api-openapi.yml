    patch:
      tags:
      - Users
      summary: Update User
      description: Update values of the platform user. The response of the operation will be the updated user. The updates are applied through patch logic, which means that only the fields that are included in the request will be updated. The rest of the fields will remain unchanged.
      operationId: updateUser
      parameters:
      - name: id
        in: path
        description: The id of the user to be updated.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: 6409edb91c6c14300fce1a3c
      - name: X-API-Version
        in: header
        description: API version to use.
        required: false
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - '2024-09-25'
      requestBody:
        description: 'Request body for operation: updateUser.'
        content:
          application/json:
            schema:
              type: array
              items:
                description: Patch object for user
                properties:
                  op:
                    type: string
                    description: Supported patch operations
                    enum:
                    - replace
                  path:
                    type: string
                    description: Supported patch paths for User
                    enum:
                    - /email
                    - /givenName
                    - /familyName
                  value:
                    type: string
            examples:
              Example patch operations:
                description: Patch operation to update the user.
                value:
                - op: replace
                  path: /email
                  value: alice.piable@apiable.io
        required: true
      responses:
        '200':
          description: 'OK: User updated successfully.'
          content:
            application/json:
              schema:
                description: User object
