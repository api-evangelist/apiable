      summary: Cancel and revoke a subscription
      description: Cancels and revokes a subscription at the specified timestamp. This operation will cancel the subscription in the billing system and revoke API access. The cancellation will take effect at the timestamp provided in the cancelAt field.
      operationId: cancelAndRevokeSubscription
      parameters:
      - name: id
        in: path
        description: Subscription ID to cancel and revoke
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: 6268ec80a098ed05f047f278
      - name: X-API-Version
        in: header
        description: API version to use.
        required: false
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - '2024-09-25'
      requestBody:
        description: Request body containing the timestamp for when the subscription cancellation should take effect
        content:
          application/json:
            schema:
              properties:
                cancelAt:
                  type: integer
                  format: int64
                  description: The timestamp when the subscription should be cancelled, in Unix seconds (UTC timezone)
            examples:
              Cancel subscription request:
                description: Example request to cancel and revoke a subscription. The cancelAt field is a Unix timestamp (epoch seconds UTC) indicating when the cancellation should take effect.
                value:
                  cancelAt: 1704067200
        required: true
      responses:
        '200':
          description: 'OK: Subscription canceled and revoked successfully.'
          content:
            application/json: {}
        '400':
          description: 'Bad Request: Subscription cannot be canceled in its current state or invalid cancelAt timestamp.'
          content:
            application/json:
              schema:
                type: string
              examples:
                Invalid State:
                  description: Error message when the subscription cannot be canceled due to its current state.
                  value:
                    timestamp: '2024-09-30T12:17:51.528+00:00'
                    status: 400
                    error: Bad Request
                    message: Subscription cannot be canceled in its current state
                    path: /api/subscriptions/6268ec80a098ed05f047f278
        '401':
          description: 'Unauthorized for operation: cancelAndRevokeSubscription'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unauthorized
                  status:
                    type: string
                    example: '401'
