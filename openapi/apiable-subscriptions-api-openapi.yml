        explode: false
        schema:
          type: string
          enum:
          - '2024-09-25'
      requestBody:
        description: 'Request body for operation: meterSubscriptionUsage.'
        content:
          application/json:
            schema:
              type: array
              items:
                properties:
                  subscriptionId:
                    type: string
                  integrationId:
                    type: string
                  quantity:
                    type: integer
                    format: int32
                  timestamp:
                    type: integer
                    format: int64
                    description: The timestamp for the usage event, in Unix seconds (UTC timezone). Defaults to current time if not provided.
                  lookupkey:
                    type: string
                  action:
                    type: string
            examples:
              Example subscription metering request using integration id:
                description: Custom property object with key-value pair.
                value:
                  integrationId: lol4o90zl0a
                  quantity: 1
                  action: increment
                  timestamp: 1750812600
              Example subscription metering request using subscription id:
                description: Custom property object with key-value pair.
                value:
                  subscriptionId: 685acdf14cca56585c6833c4
