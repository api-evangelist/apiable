openapi: 3.2.0
info:
  title: Apiable Platform Subscriptions API
  description: '## Introduction


    The Apiable Platform API is a RESTful API that allows you to manage your portal, teams, users, and subscriptions.'
  contact:
    name: Apiable Team
    url: https://apiable.io
    email: support@apiable.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: v2
servers:
- url: https://developer.apiable.io
tags:
- name: Subscriptions
  description: Operations related to managing subscriptions, including retrieval, update, approval, rejection, and refreshing the status of connected monetization. For security reasons, API keys, secrets, and other sensitive information included in the subscriptions are not returned in the response.
paths:
  /api/subscriptions/{id}/custom-properties:
    put:
      tags:
      - Subscriptions
      summary: Read/Write subscription custom properties
      description: Reads and writes custom properties of a subscription. Custom properties are key-value pairs that can be used to store additional information about the subscription. The custom properties are returned in the response when the subscription is retrieved. The custom properties can be updated by providing a list of custom properties in the request body.
      operationId: updateCustomProperties
      parameters:
      - name: id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: X-API-Version
        in: header
        description: API version to use.
        required: false
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - '2024-09-25'
      requestBody:
        description: 'Request body for operation: updateCustomProperties.'
        content:
          application/json:
            schema:
              type: array
              items:
                description: Custom Property
                discriminator:
                  propertyName: type
                properties:
                  readOnly:
                    type: boolean
                    description: Whether the custom property is read only
                  id:
                    type: string
                  type:
                    type: string
                    description: The type of the custom property
                    enum:
                    - STRING
                    - NUMBER
                    - BOOLEAN
                    - TEXT
                    - OPTIONS
                    - MULTI_OPTIONS
                  description:
                    type: string
                    description: The description of the custom property
                  includeInSubscriptionWizard:
                    type: boolean
                    description: Whether the custom property is included in the subscription wizard
                  required:
                    type: boolean
                    description: Whether the custom property is required
                  display:
                    type: string
                    description: The display name of the custom property
            examples:
              Example custom property:
                description: Custom property object with key-value pair.
                value:
                  display: new display
                  type: STRING
                  description: string
                  readOnly: true
                  required: true
                  includeInSubscriptionWizard: true
                  value: new value2
        required: true
      responses:
        '200':
          description: 'OK: Subscription updated successfully.'
          content:
            application/json:
              schema:
                description: Subscription object
                properties:
                  version:
                    type: integer
                    format: int32
                  created:
                    type: string
                    format: date-time
                  updated:
                    type: string
                    format: date-time
                  id:
                    type: string
                  name:
                    type: string
                    description: The name of the subscription
                  status:
                    type: string
                    description: The status of the subscription
                    enum:
                    - PENDING_PAYMENT
                    - PAYMENT_FAILED
                    - PENDING
                    - ACTIVE
                    - REJECTED
                    - CANCELLED
                    - EXPIRED
                    - PENDING_CANCELLATION
                  approvalEmailSent:
                    type: boolean
                    description: Flag to indicate if an email has been sent to the approval group for this subscription
                  plan:
                    description: Unique identifier to an object
                    properties:
                      id:
                        type: string
                  team:
                    description: Unique identifier to an object
                    properties:
                      id:
                        type: string
                  expires:
                    type: string
                    format: date-time
                    description: The date the subscription will expire
                  integrationId:
                    type: string
                    description: Integration ID of the subscription in the API Gateway
                  auth:
                    description: Authentication details for the subscription
                    discriminator:
                      propertyName: type
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                        enum:
                        - BASIC_API_KEY
                        - INTERMEDIATE_JWT
                        - INTERMEDIATE_CLIENT_CREDENTIAL
                        - ADVANCED_CODE_FLOW
                        - EVOLVED_CENTRALIZED_CLAIMS
                      integrationId:
                        type: string
                  lastAuth:
                    description: Authentication details for the subscription
                    discriminator:
                      propertyName: type
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                        enum:
                        - BASIC_API_KEY
                        - INTERMEDIATE_JWT
                        - INTERMEDIATE_CLIENT_CREDENTIAL
                        - ADVANCED_CODE_FLOW
                        - EVOLVED_CENTRALIZED_CLAIMS
                      integrationId:
                        type: string
                  cancelled:
                    type: string
                    format: date-time
                    description: The date the subscription was marked as cancelled
                  checkoutSession:
                    type: string
                    description: Checkout session ID for the subscription, only used when the subscription is created through the checkout
                  stripeSubscriptionId:
                    type: string
                    description: Integration ID of the subscription in the Monetization service provider
                  priceIds:
                    type: array
                    description: The monetization service price IDs of the subscription
                    items:
                      type: string
                      description: The monetization service price IDs of the subscription
                  usageMeter:
                    type: string
                    description: The monetization service usage meter ID of the subscription
                  owner:
                    description: Unique identifier to an object
                    properties:
                      id:
                        type: string
                  email:
                    type: string
                    description: The email of the subscription owner
                  customProperties:
                    type: array
                    description: The custom properties of the subscription
                    items:
                      description: Custom Property
                      discriminator:
                        propertyName: type
                      properties:
                        readOnly:
                          type: boolean
                          description: Whether the custom property is read only
                        id:
                          type: string
                        type:
                          type: string
                          description: The type of the custom property
                          enum:
                          - STRING
                          - NUMBER
                          - BOOLEAN
                          - TEXT
                          - OPTIONS
                          - MULTI_OPTIONS
                        description:
                          type: string
                          description: The description of the custom property
                        includeInSubscriptionWizard:
                          type: boolean
                          description: Whether the custom property is included in the subscription wizard
                        required:
                          type: boolean
                          description: Whether the custom property is required
                        display:
                          type: string
                          description: The display name of the custom property
              examples:
                Example response:
                  description: Updated subscription with all non-sensitive information.
                  value:
                    id: 66f693e5c8ec2f3e25b2b854
                    created: '2024-09-27T14:15:49.319'
                    updated: '2024-09-27T14:45:08.03'
                    name: '202409271415'
                    status: ACTIVE
                    approvalEmailSent: true
                    plan:
                      id: 66f174095cc1da3963b9a1d7
                    team:
                      id: 62691aa099a7d17e2cac7664
                    integrationId: xxxxxxxxxx
                    auth:
                      type: INTERMEDIATE_CLIENT_CREDENTIAL
                      id: _apbl_###
                      integrationId: xxxxxxxxxx
                      registrationClientUri: https://dev.apiable.io/api/oauth2/oauth-token/_APBL_###
                      redirectUri: https://dev.apiable.io
                      examples:
                        curl: '###'
                    checkoutSession: cs_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                    stripeSubscriptionId: sub_xxxxxxxxxxxxxxxxxxxxxxxx
                    priceIds:
                    - price_xxxxxxxxxxxxxxxxxxxxxxxx
                    owner:
                      id: 62691aa099a7d17e2cac7663
                    customProperties:
                    - id: 66f69ac4ccc00456987e3df8
                      display: new display
                      type: STRING
                      description: string
                      readOnly: true
                      required: true
                      includeInSubscriptionWizard: true
                      value: new value2
                    version: 5
        '400':
          description: 'Bad Request: Invalid update parameters or operation.'
          content:
            application/json:
              schema:
                type: string
              examples:
                BadRequest:
                  description: Error message when the patch operation is not allowed for the subscription.
                  value: Bad Request
        '401':
          description: 'Unauthorized for operation: updateCustomProperties'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unauthorized
                  status:
                    type: string
                    example: '401'
        '404':
          description: 'Not Found: The subscription to update does not exist.'
          content:
            application/json:
              schema:
                type: string
              examples:
                NotFound:
                  description: Error message when the subscription to be updated is not found.
                  value: Not Found
      security:
      - oauth-cc:
        - apiable/platform
  /api/subscriptions:
    get:
      tags:
      - Subscriptions
      summary: Retrieve all subscriptions
      description: Fetches a paginated, sortable, and filterable list of all subscriptions accessible to the user. Each subscription includes details such as ID, name, status, and other relevant metadata, while omitting sensitive information like API keys and secrets.
      operationId: findAllSubscriptions
      parameters:
      - name: page
        in: query
        description: Zero-based page index for pagination in the findAllSubscriptions request query parameters.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
        example: 0
      - name: size
        in: query
        description: Number of subscriptions to return per page in the findAllSubscriptions request query parameters.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
        example: 10
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property,asc|desc. Example: created,desc in the findAllSubscriptions request query parameters'
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
        example:
        - created,desc
      - name: search
        in: query
        description: 'Search filter in the format: property.op=value in the findAllSubscriptions request query parameters. Multiple criteria can be separated by semicolons. Example: status.in=PENDING;PENDING_PAYMENT'
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
        example:
        - status.in=PENDING;PENDING_PAYMENT
      - name: X-API-Version
        in: header
        description: API version to use.
        required: false
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - '2024-09-25'
      - name: resolve
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: 'OK: Successfully retrieved the list of subscriptions.'
          content:
            application/json:
              schema:
                description: Response object for paginated subscription results
                properties:
                  content:
                    type: array
                    items:
                      description: Subscription object
                      properties:
                        version:
                          type: integer
                          format: int32
                        created:
                          type: string
                          format: date-time
                        updated:
                          type: string
                          format: date-time
                        id:
                          type: string
                        name:
                          type: string
                          description: The name of the subscription
                        status:
                          type: string
                          description: The status of the subscription
                          enum:
                          - PENDING_PAYMENT
                          - PAYMENT_FAILED
