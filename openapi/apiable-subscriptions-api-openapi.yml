    post:
      tags:
      - Subscriptions
      summary: Create a new subscription
      description: 'Creates a new subscription programmatically with the specified plan, team, and owner. The subscription status will depend on the plan configuration: PENDING if approval is required, PENDING_PAYMENT if payment is required, or ACTIVE otherwise.

        For migration scenarios, you can optionally provide an authIntegrationId to link the subscription to an existing API key/credential in your gateway. However, please note: Automatic retrieval of authorization details will depend on the security level of the authorization schema, and may not be possible with stricter security settings. For example in cases where the client secret cannot be retrieved after being initially generated.'
      operationId: createSubscription
      parameters:
      - name: X-API-Version
        in: header
        description: API version to use.
        required: false
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - '2024-09-25'
      requestBody:
        description: 'Request body for operation: createSubscription.'
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                plan:
                  description: Unique identifier to an object
                  properties:
                    id:
                      type: string
                team:
                  description: Unique identifier to an object
                  properties:
                    id:
                      type: string
                owner:
                  description: Unique identifier to an object
                  properties:
                    id:
                      type: string
                email:
                  type: string
                  description: Optional email of the subscription owner, used to link the subscrpition to a specific user before they register.
                customProperties:
                  type: array
                  description: Custom properties with only id and value required
                  items:
                    description: Custom Property
                    discriminator:
                      propertyName: type
                    properties:
                      readOnly:
                        type: boolean
                        description: Whether the custom property is read only
                      id:
                        type: string
                      type:
                        type: string
                        description: The type of the custom property
                        enum:
                        - STRING
                        - NUMBER
                        - BOOLEAN
                        - TEXT
                        - OPTIONS
                        - MULTI_OPTIONS
                      description:
                        type: string
                        description: The description of the custom property
                      includeInSubscriptionWizard:
                        type: boolean
                        description: Whether the custom property is included in the subscription wizard
                      required:
                        type: boolean
                        description: Whether the custom property is required
                      display:
                        type: string
                        description: The display name of the custom property
                authIntegrationId:
                  type: string
                  description: Optional auth integration ID if importing an existing subscription
            examples:
              Create subscription request:
                description: Example request to create a new subscription with a custom property.
                value: "\n                {\n                  \"name\": \"Programmatic subscription with custom properties\",\n                  \"plan\": \"68a4676693bf757a8141f824\",\n                  \"team\": \"62691aa099a7d17e2cac7664\",\n                  \"customProperties\": [\n                      {\n                        id: \"62691aa099a7d17e2cac7665\",\n                        value: \"custom property example value\",\n                      }\n                  ]\n                }\n                "
              Create subscription with existing gateway auth:
                description: 'Example request for migration scenarios where you want to link the subscription to an existing API key/credential in your gateway. The authIntegrationId should match the identifier of the existing credential in your gateway. Note: This is not supported when using Apiable Client Credentials, as secrets cannot be retrieved once generated.'
                value:
                  name: Migrated subscription with existing auth
                  plan: 68a4676693bf757a8141f824
                  team: 62691aa099a7d17e2cac7664
                  email: user@example.com
                  authIntegrationId: abc123-existing-api-key-id
        required: true
      responses:
        '200':
          description: 'OK: Subscription created successfully.'
          content:
            application/json:
              schema:
                description: Subscription object
                properties:
                  version:
                    type: integer
                    format: int32
                  created:
                    type: string
                    format: date-time
                  updated:
                    type: string
