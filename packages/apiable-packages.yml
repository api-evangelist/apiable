note: >-
  Apiable publishes NO first-party client SDK for the Apiable Platform API. The only first-party
  distributions are a GitHub Action that pushes an OpenAPI spec into a portal documentation entry
  from CI, and one npm library (react-curity) that wires a React app to a Curity authorization
  server — an auth helper, not a Platform API client. Apiable's own answer to SDKs is
  stubs-generator, an example Maven project that generates stubs from any OpenAPI spec rather than
  a maintained, versioned client. No package exists on PyPI, Maven Central, NuGet, pkg.go.dev,
  RubyGems, Packagist or crates.io under an apiable/io.apiable coordinate.
